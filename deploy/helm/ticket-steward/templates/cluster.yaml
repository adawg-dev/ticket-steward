# What the pods need of the cluster and of AWS: the dispatcher's AWS environment and MinIO's issuer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: steward-cluster
data:
  issuer: {{ required "cluster.issuer is required: the public service-account issuer URL" .Values.cluster.issuer | trimSuffix "/" | quote }}
  awsRoleArn: {{ required "aws.roleArn is required: the dispatcher's IAM role" .Values.aws.roleArn | quote }}
  awsRegion: {{ required "aws.region is required" .Values.aws.region | quote }}
{{- if .Values.config.bundle }}
---
# The config dir (steward.config.ts, prompts, the overlay template) as one gzipped tar: ConfigMap keys are flat and the
# dir is not. The dispatcher and every run pod unpack it at start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: steward-config
binaryData:
  config.tgz: {{ .Values.config.bundle | trim | quote }}
{{- end }}
