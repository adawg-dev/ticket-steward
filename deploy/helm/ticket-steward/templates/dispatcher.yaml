# The dispatcher: webhooks, the SQLite job state, one Job per run. One replica, and Recreate so a new pod never runs
# beside the old one on the same SQLite file; a restart reattaches to the live run pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steward
  labels:
    app: steward
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: steward
  template:
    metadata:
      labels:
        app: steward
      annotations:
        # A new config bundle restarts the dispatcher; run pods read the bundle when they start.
        steward/config-checksum: {{ .Values.config.bundle | sha256sum | quote }}
    spec:
      serviceAccountName: steward-dispatcher
      terminationGracePeriodSeconds: 120
      initContainers:
        # The volume's root is root-owned on a new volume; the steward runs as 1001 and doctor expects its dataDir 0700.
        - name: data-permissions
          image: {{ include "steward.image" .Values.images.steward | quote }}
          imagePullPolicy: {{ .Values.images.steward.pullPolicy }}
          command: ["sh", "-c", "chown 1001:1001 /var/lib/ticket-steward && chmod 0700 /var/lib/ticket-steward"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/ticket-steward
        # The config bundle unpacked as in every run pod (src/k8s/runJob.ts, configUnpackCommand).
        - name: config-unpack
          image: {{ include "steward.image" .Values.images.steward | quote }}
          imagePullPolicy: {{ .Values.images.steward.pullPolicy }}
          command: ["sh", "-c", 'tar -xzf "$1" -C "$2" --strip-components=1 --no-same-owner --no-same-permissions', "config-unpack", "/etc/steward-config-bundle/config.tgz", "/etc/ticket-steward"]
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config-bundle
              mountPath: /etc/steward-config-bundle
              readOnly: true
            - name: config
              mountPath: /etc/ticket-steward
      containers:
        - name: steward
          image: {{ include "steward.image" .Values.images.steward | quote }}
          imagePullPolicy: {{ .Values.images.steward.pullPolicy }}
          args: ["--config", "/etc/ticket-steward/steward.config.ts", "serve"]
          env:
            # No secret is set here: config load reads each one from Secrets Manager through `secrets.map`. The SDK's
            # default chain assumes the role with the projected token; nothing else holds an AWS credential.
            - name: AWS_ROLE_ARN
              valueFrom:
                configMapKeyRef:
                  name: steward-cluster
                  key: awsRoleArn
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: steward-cluster
                  key: awsRegion
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/steward/aws/token
          ports:
            - name: http
              containerPort: 3020
            - name: internal
              containerPort: 3021
          readinessProbe:
            httpGet:
              path: /health
              port: 3020
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dispatcher.resources | nindent 12 }}
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/ticket-steward
            - name: config
              mountPath: /etc/ticket-steward
              readOnly: true
            - name: runtime
              mountPath: /run/steward
            - name: aws-token
              mountPath: /var/run/secrets/steward/aws
              readOnly: true
            # For doctor's MinIO STS check; the dispatcher itself reads no session.
            - name: minio-token
              mountPath: /var/run/secrets/steward/minio
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: steward-data
        # A missing config.tgz key keeps the pod from starting.
        - name: config-bundle
          configMap:
            name: steward-config
            items:
              - key: config.tgz
                path: config.tgz
        - name: config
          emptyDir:
            sizeLimit: 64Mi
        # serve writes the admin API's token here: memory only, gone with the pod.
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
        - name: minio-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: minio
                  expirationSeconds: 3600
                  path: token
---
# The SQLite job state and the mirror. Kept when the release is uninstalled.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: steward-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "steward.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.storage.stewardData }}
---
# Webhooks and /health; the public URL reaches it through the ingress, or a node port.
apiVersion: v1
kind: Service
metadata:
  name: steward
spec:
  type: {{ .Values.dispatcher.service.type }}
  selector:
    app: steward
  ports:
    - name: http
      port: 3020
      targetPort: 3020
      {{- if and (eq .Values.dispatcher.service.type "NodePort") .Values.dispatcher.service.nodePort }}
      nodePort: {{ .Values.dispatcher.service.nodePort }}
      {{- end }}
---
# The run pods' callbacks (runtime.callbackUrl: http://steward-internal.<namespace>.svc:3021). The NetworkPolicy
# admits run pods only. The admin API (3022) listens on the pod's loopback and has no Service.
apiVersion: v1
kind: Service
metadata:
  name: steward-internal
spec:
  selector:
    app: steward
  ports:
    - name: internal
      port: 3021
      targetPort: 3021
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: steward
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ required "ingress.host is required" $.Values.ingress.host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          # Only the webhooks and /health exist on this port.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: steward
                port:
                  number: 3020
{{- end }}
