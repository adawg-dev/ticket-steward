# Isolation for the namespace; the cluster's network plugin must enforce NetworkPolicy (k3s's kube-router, Calico,
# Cilium). Everything is denied unless a policy below allows it. Run pods are the pods with a steward.run-id label:
# every run Job's pod, and doctor's probe pod. The API server is reached through the service CIDR or a node IP, both
# private, so only the dispatcher, whose egress is open, reaches it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Run pods: DNS, MinIO's S3 port (session sync), the dispatcher's callback port, and the internet, but no private range,
# so not the API server, other run pods or anything else in the cluster or on the LAN. No ingress: `steward chat`
# attaches through the kubelet, not the pod network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: run-pods
spec:
  podSelector:
    {{- include "steward.runPodSelector" . | nindent 4 }}
  policyTypes: ["Ingress", "Egress"]
  egress:
    {{- include "steward.dns" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app: steward
      ports:
        - protocol: TCP
          port: 3021
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- include "steward.privateRanges" . | nindent 14 }}
---
# The private ranges run pods may still reach (runPods.allowCidrs, equal to runtime.egressAllowCidrs). Empty, it
# allows nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: run-pods-allow-cidrs
spec:
  podSelector:
    {{- include "steward.runPodSelector" . | nindent 4 }}
  policyTypes: ["Egress"]
  {{- with .Values.runPods.allowCidrs }}
  egress:
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
  {{- else }}
  egress: []
  {{- end }}
---
# The dispatcher: webhooks on 3020 from anywhere (the ingress controller or a node port), run callbacks on 3021 from
# run pods only. Its egress stays open: the API server, Linear, GitLab, AWS, MinIO.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dispatcher
spec:
  podSelector:
    matchLabels:
      app: steward
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 3020
    - from:
        - podSelector:
            {{- include "steward.runPodSelector" . | nindent 12 }}
      ports:
        - protocol: TCP
          port: 3021
  egress:
    - {}
---
# MinIO: S3 from run pods and the dispatcher; out only to DNS and the public issuer (its discovery document and JWKS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            {{- include "steward.runPodSelector" . | nindent 12 }}
        - podSelector:
            matchLabels:
              app: steward
      ports:
        - protocol: TCP
          port: 9000
  egress:
    {{- include "steward.dns" . | nindent 4 }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- include "steward.privateRanges" . | nindent 14 }}
