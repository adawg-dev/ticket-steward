# kubectl apply -k deploy/k8s/base (docs/ops.md, "Running on k3s"). Set the steward-cluster values and the images
# below for your cluster, or override them in an overlay. The steward-config ConfigMap (the config dir as a gzipped tar
# under the key config.tgz) is created separately; docs/ops.md has the commands.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ticket-steward
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - rbac.yaml
  - dispatcher.yaml
  - services.yaml
  - minio.yaml
  - networkpolicy.yaml
configMapGenerator:
  # What the manifests need of the cluster and of AWS. issuer is k3s's public service-account-issuer URL, with no
  # trailing slash; serviceCidr and podCidr are k3s's --service-cidr and --cluster-cidr.
  - name: steward-cluster
    literals:
      - issuer=https://k3s-oidc.example.com
      - awsRoleArn=arn:aws:iam::123456789012:role/ticket-steward
      - awsRegion=eu-west-2
      - serviceCidr=10.43.0.0/16
      - podCidr=10.42.0.0/16
  - name: minio-policy
    files:
      - policy.json=minio-policy.json
images:
  - name: ticket-steward/steward
    newName: registry.example.com/ticket-steward/steward
    newTag: latest
  - name: ticket-steward/minio
    newName: registry.example.com/ticket-steward/minio
    newTag: RELEASE.2025-10-15T17-29-55Z
replacements:
  - source:
      kind: ConfigMap
      name: steward-cluster
      fieldPath: data.serviceCidr
    targets:
      - select:
          kind: NetworkPolicy
          name: run-pods
        fieldPaths:
          - spec.egress.3.to.0.ipBlock.except.3
      - select:
          kind: NetworkPolicy
          name: minio
        fieldPaths:
          - spec.egress.1.to.0.ipBlock.except.3
  - source:
      kind: ConfigMap
      name: steward-cluster
      fieldPath: data.podCidr
    targets:
      - select:
          kind: NetworkPolicy
          name: run-pods
        fieldPaths:
          - spec.egress.3.to.0.ipBlock.except.4
      - select:
          kind: NetworkPolicy
          name: minio
        fieldPaths:
          - spec.egress.1.to.0.ipBlock.except.4
