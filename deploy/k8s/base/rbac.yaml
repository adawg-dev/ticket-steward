# The dispatcher's rights, in its own namespace only: a Job, a spec ConfigMap and a pod per run, the TTY of a chat's
# run pod, and doctor's read of the NetworkPolicies and its probe pod. Nothing cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: steward-dispatcher
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/attach", "pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: steward-dispatcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: steward-dispatcher
subjects:
  - kind: ServiceAccount
    name: steward-dispatcher
